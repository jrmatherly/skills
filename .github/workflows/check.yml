name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are noise; every main commit keeps its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # claude plugin validate and test run without a login; only the
      # type-check needs the declarations /plugin-authoring writes, so it stays local
      - run: npm install -g @anthropic-ai/claude-code
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning scripts/* .githooks/* jstack/tests/*.sh
      - run: scripts/check-resume
      - run: scripts/check-jstack --no-types
      - run: bun install --frozen-lockfile --production --ignore-scripts && bun test orch watch-pr check-plan.test.ts
        working-directory: plugins/jstack/skills/j-mode/scripts
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the action comments its findings on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No license line: personal-account repos need none
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
